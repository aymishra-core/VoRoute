# Single instance only. Job rows live in the database. The in-flight media
# stream and the MP3 still live in this process, so more than one instance
# would split Twilio's websocket from the process that placed the call.
# Do not add a scaling block.
# After the first deploy, set PUBLIC_BASE_URL in the Render dashboard to the
# live Render URL (the onrender.com host this service is given).
services:
  - type: web
    name: voroute
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install .
    startCommand: uvicorn voroute.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: VOROUTE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
