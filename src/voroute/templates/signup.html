{% extends "base.html" %}
{% block title %}Sign up — VoRoute{% endblock %}
{% block body_class %}auth{% endblock %}
{% block body %}
<div class="card">
  <p class="kicker">Account</p>
  <h1>Sign up</h1>
  <p class="lede">A pilot account for your brand.</p>
  <form method="post" action="/signup">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Brand <input name="brand_name" type="text" autocomplete="organization"></label>
    <label>Email <input name="email" type="text" autocomplete="username"></label>
    <label>Password <input name="password" type="password" autocomplete="new-password"></label>
    <button type="submit">Create account</button>
  </form>
  <p class="lede">Already registered? <a href="/login">Log in</a></p>
</div>
{% endblock %}
