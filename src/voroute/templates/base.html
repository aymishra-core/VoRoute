<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0e1a">
  <title>{% block title %}VoRoute{% endblock %}</title>
  <link rel="stylesheet" href="/static/cockpit.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.12/htmx.min.js" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="wrap">
    <header class="top">
      <a class="wordmark" href="/app">Vo<span>Route</span></a>
      {% block header_extra %}{% endblock %}
    </header>
    <main class="doc">
      {% block body %}{% endblock %}
    </main>
  </div>
</body>
</html>
