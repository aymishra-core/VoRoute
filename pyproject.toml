[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voroute"
version = "0.1.0"
description = "Server-side voice AI that confirms COD orders by phone for Indian D2C brands."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "plivo==4.63.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
